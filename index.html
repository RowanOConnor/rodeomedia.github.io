<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rodeo Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Y2K background graphics: kept faint on purpose -->
  <div class="bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <svg class="spark spark-a" viewBox="0 0 100 100"><path d="M50 0C54 34 66 46 100 50 66 54 54 66 50 100 46 66 34 54 0 50 34 46 46 34 50 0Z"/></svg>
    <svg class="spark spark-b" viewBox="0 0 100 100"><path d="M50 0C54 34 66 46 100 50 66 54 54 66 50 100 46 66 34 54 0 50 34 46 46 34 50 0Z"/></svg>
    <span class="ring ring-a"></span>
    <span class="ring ring-b"></span>
  </div>

  <main class="stage">
    <h1 class="wordmark">Rodeo Media</h1>

    <form class="signup glass" id="signup" novalidate>
      <label class="sr-only" for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email" required>
      <button type="submit">Sign me up</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
